name: Smart Dashboard CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMG: ${{ github.repository_owner }}/smart-dashboard

jobs:
  # ──────────────────────────── ML Service ─────────────────────────────────
  ml-service:
    name: ML Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - run: pip install -r requirements.txt

      - name: Train models
        run: python train.py

      - name: Run ML tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-test-results
          path: ml-service/test-results.xml

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        if: github.event_name == 'push'
        with:
          context: ml-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMG }}-ml:latest
            ${{ env.REGISTRY }}/${{ env.IMG }}-ml:${{ github.sha }}

  # ──────────────────────────── Backend ─────────────────────────────────
  backend:
    name: Backend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Run tests
        run: npm test --if-present
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret
          ML_SERVICE_URL: http://localhost:8000/predict

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        if: github.event_name == 'push'
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMG }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMG }}-backend:${{ github.sha }}

  # ──────────────────────────── Frontend ─────────────────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:5000
          REACT_APP_SOCKET_URL: http://localhost:5000

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        if: github.event_name == 'push'
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMG }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMG }}-frontend:${{ github.sha }}

  # ──────────────────────────── Integration Smoke Test ─────────────────────────────────
  integration:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [ml-service, backend, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start ML service
        run: |
          cd ml-service
          pip install -r requirements.txt -q
          python train.py
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 8
          curl -sf http://localhost:8000/health

      - name: Smoke test /predict
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"asset_id":"AST-001","vibration":1.2,"temperature":45,"pressure":2.5}' \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert 'health_score' in d and 0 <= d['health_score'] <= 100
          assert 'rul' in d and d['rul'] >= 0
          assert d['status'] in ['healthy','caution','critical']
          print('ML predict OK:', d)
          "

  # ──────────────────────────── Deploy to Staging ─────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/smart-dashboard
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps

      - name: Verify
        run: |
          sleep 20
          curl -sf ${{ vars.STAGING_URL }}/api/status | grep '"ok":true'
          echo "Staging deploy verified"
